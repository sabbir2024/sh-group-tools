        .session-info-wrapper {
            --progress: 0;

        .session-info-wrapper::before {
            content: "";
            position: absolute;
            inset: 0;
            padding: 3px;
            border-radius: 8px;

            background:
                conic-gradient(
                    #007bff
                    calc(var(--progress) * 1%),
                    #d6ebff 0
                );

            -webkit-mask:
                linear-gradient(#fff 0 0)
                content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;
            mask-composite: exclude;

            pointer-events: none;
        }

        .session-info-wrapper.expired-border::before {
            background:
                conic-gradient(

<script>


/* =================================================
   HEADER DATE / TIME
================================================= */

function updateHeaderDateTime() {

    const element =
        document.getElementById(
            "headerDateTime"
        );

    const now =
        new Date();

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const year =
        now.getFullYear();

    let hours =
        now.getHours();

    const minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    const seconds =
        String(
            now.getSeconds()
        ).padStart(2, "0");

    const ampm =
        hours >= 12
            ? "pm"
            : "am";

    hours =
        hours % 12 || 12;

    hours =
        String(hours)
            .padStart(2, "0");

    element.textContent =
        `${day}-${month}-${year} ${hours}:${minutes}:${seconds} ${ampm}`;

}


updateHeaderDateTime();


setInterval(
    updateHeaderDateTime,
    1000
);


/* =================================================
   LOGIN SYSTEM
================================================= */

const LOGIN_PASSWORD = "1234";


const loginScreen =
    document.getElementById(
        "loginScreen"
    );


const mainPage =
    document.getElementById(
        "mainPage"
    );


const passwordInput =
    document.getElementById(
        "passwordInput"
    );


const loginBtn =
    document.getElementById(
        "loginBtn"
    );


const loginError =
    document.getElementById(
        "loginError"
    );


const lockBtn =
    document.getElementById(
        "lockBtn"
    );


/* =================================================
   LOGIN
================================================= */

function login() {

    const password =
        passwordInput.value;


    if (
        password ===
        LOGIN_PASSWORD
    ) {

        loginScreen.style.display =
            "none";


        mainPage.style.display =
            "block";


        lockBtn.style.display =
            "block";


        loginError.style.display =
            "none";


        passwordInput.value =
            "";


        setTimeout(
            function() {

                const sessionInput =
                    document.getElementById(
                        "sessionInput"
                    );


                const ogpInput =
                    document.getElementById(
                        "ogpInput"
                    );


                if (
                    ogpInput.value.trim() !== ""
                ) {

                    ogpInput.focus();

                }

                else if (
                    sessionInput.value.trim() === ""
                ) {

                    sessionInput.focus();

                }

            },
            100
        );

    }

    else {

        loginError.style.display =
            "block";


        passwordInput.value =
            "";


        passwordInput.focus();

    }

}


/* =================================================
   LOGIN BUTTON
================================================= */

loginBtn.addEventListener(
    "click",
    login
);


/* =================================================
   ENTER TO LOGIN
================================================= */

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            login();

        }

    }
);


/* =================================================
   LOCK PAGE
================================================= */

function lockPage() {

    mainPage.style.display =
        "none";


    lockBtn.style.display =
        "none";


    loginScreen.style.display =
        "flex";


    loginError.style.display =
        "none";


    passwordInput.value =

    setTimeout(
        function() {

            passwordInput.focus();

        },
        100

}


/* =================================================
   LOCK BUTTON CLICK
================================================= */

lockBtn.addEventListener(
    "click",
    lockPage
);


/* =================================================
   LOCK SHORTCUT
   Ctrl + Shift + L
================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() === "l"
        ) {

            event.preventDefault();


            if (
                loginScreen.style.display !== "flex" &&
                mainPage.style.display !== "none"
            ) {

                lockPage();

        }

    }
);

        document.getElementById(
            "sessionInput"
        );


    sessionArea.style.display =

        "none";


    setTimeout(
        function() {

            sessionInput.focus();

            sessionInput.select();

        },
        50
    );

}


document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() === "s"
        ) {

            event.preventDefault();


            if (

    90;


const fullTextPause =
    20;


const emptyTextPause =

/* =================================================
   EYES
================================================= */

const eyesContainer =
    document.getElementById(
        "eyesContainer"
    );


const eyes =
    document.querySelectorAll(
        ".eye"
    );


const pupils =
    document.querySelectorAll(
        ".pupil"
    );


function moveEyes(
    clientX,
    clientY
) {

    eyes.forEach(
        function(
            eye,
            index
        ) {

            const rect =
                eye.getBoundingClientRect();


            const eyeCenterX =
                rect.left +
                rect.width / 2;


            const eyeCenterY =
                rect.top +
                rect.height / 2;


            const deltaX =
                clientX -
                eyeCenterX;


            const deltaY =
                clientY -
                eyeCenterY;


            const angle =
                Math.atan2(
                    deltaY,
                    deltaX
                );


            const maxMove =
                12;


            const distance =
                Math.min(
                    maxMove,
                    Math.sqrt(
                        deltaX * deltaX +
                        deltaY * deltaY
                    ) / 8
                );


            const moveX =
                Math.cos(angle) *
                distance;


            const moveY =
                Math.sin(angle) *
                distance;


            pupils[index].style.transform =
                "translate(calc(-50% + " +
                moveX +
                "px), calc(-50% + " +
                moveY +
                "px))";

        }
    );

}


document.addEventListener(
    "mousemove",
    function(event) {

        moveEyes(
            event.clientX,
            event.clientY
        );

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchmove",
    function(event) {

        if (
            event.touches &&
            event.touches.length > 0
        ) {

            moveEyes(
                event.touches[0].clientX,
                event.touches[0].clientY
            );

        }

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchstart",
    function(event) {

        if (
            event.touches &&
            event.touches.length > 0
        ) {

            moveEyes(
                event.touches[0].clientX,
                event.touches[0].clientY
            );

        }

    },
    {
        passive: true
    }
);


/* =================================================
   RESET EYES
================================================= */

function resetEyes() {

    eyesContainer.classList.remove(
        "expired"
    );

}


/* =================================================
   RED EYES
================================================= */

function makeEyesRed() {

    eyesContainer.classList.add(

    );

}


/* =================================================
   OPEN SESSION HOME
================================================= */

function openSessionHome() {

    if (
        expiredLinkOpened
    ) {

        return;

    }


    expiredLinkOpened =
        true;


    window.open(
        SESSION_HOME_URL,
        "_blank"
    );

}


/* =================================================
   OGP INCREMENT / DECREMENT
================================================= */

function changeOGP(step) {

    const input =
        document.getElementById(
            "ogpInput"
        );


    let value =
        input.value.trim();


    if (
        value === ""
    ) {

        if (
            step > 0
        ) {

            input.value =
                "2";

            generateLinks();

        }


        input.focus();

        return;

    }


    if (
        !/^\d+$/.test(value)
    ) {

        return;

    }


    let number =
        parseInt(
            value,
            10
        );


    number +=
        step;


    if (
        number < 0
    ) {

        number = 0;

    }


    input.value =
        number;


    generateLinks();


    input.focus();

}

/* =================================================
   HANDLE SESSION LINK
================================================= */

function handleSessionLink() {

    const input =
        document.getElementById(
            "sessionInput"
        );


    const value =
        input.value.trim();


    const clearBtn =
        document.getElementById(
            "sessionClearBtn"
        );


    const sessionInfoWrapper =
        document.getElementById(
            "sessionInfoWrapper"
        );


    if (
        value !== ""
    ) {

        clearBtn.style.display =
            "block";


        startTypingAnimation();

    }

    else {

        clearBtn.style.display =
            "none";


        stopTypingAnimation();

    }


    if (
        value === ""
    ) {

        sessionInfoWrapper.style.display =
            "none";


        stopCountdown();


        resetEyes();


        return;

    }


    try {

        const url =
            new URL(value);


        const session =
            url.searchParams.get(
                "session"
            );


        if (!session) {

            showInvalidSession();

            return;

        }


        if (
            !/^\d+$/.test(session)
        ) {

            showInvalidSession();

            return;

        }


        currentSession =
            session;


        resetEyes();


        const sessionId =
            document.getElementById(
                "sessionId"
            );


        sessionId.textContent =
            currentSession;


        sessionId.classList.remove(
            "text-red-600"
        );


        sessionInfoWrapper.style.display =
            "block";


        document.getElementById(
            "sessionArea"
        ).style.display =
            "none";


        document.getElementById(
            "sessionSuccess"
        ).style.display =
            "block";


        startTypingAnimation();


        generateLinks();


        startCountdown();

    }


    catch (error) {

        showInvalidSession();

    }

}


/* =================================================
   INVALID SESSION
================================================= */

function showInvalidSession() {

    const sessionInfoWrapper =
        document.getElementById(
            "sessionInfoWrapper"
        );


    const sessionId =
        document.getElementById(
            "sessionId"
        );


    const countdown =
        document.getElementById(
            "countdown"
        );


    sessionInfoWrapper.style.display =
        "block";


    sessionId.textContent =
        "Invalid Link";


    sessionId.classList.add(
        "text-red-600"
    );


    countdown.textContent =
        "--";


    countdown.classList.add(
        "text-red-600"
    );


    countdown.classList.remove(
        "text-red-600"
    );


    countdown.classList.add(
        "text-red-600"
    );


    stopCountdown();

}


/* =================================================
   UPDATE BORDER
================================================= */

function updateBorderProgress() {

    const wrapper =
        document.getElementById(
            "sessionInfoWrapper"
        );


    const elapsed =
        300 -
        remainingSeconds;


    let progress =
        (elapsed / 300) *
        100;


    progress =
        Math.max(
            0,
            Math.min(
                100,
                progress
            )
        );


    wrapper.style.setProperty(
        "--progress",
        progress
    );

}


/* =================================================
   START COUNTDOWN
================================================= */

function startCountdown() {

    stopCountdown();


    remainingSeconds =
        300;


    expiredSeconds =
        0;


    isExpired =
        false;


    expiredLinkOpened =
        false;


    resetEyes();


    const countdown =
        document.getElementById(
            "countdown"
        );


    const wrapper =
        document.getElementById(
            "sessionInfoWrapper"
        );


    wrapper.style.setProperty(
        "--progress",
        0
    );


    wrapper.classList.remove(
        "expired-border"
    );


    countdown.classList.remove(
        "text-red-600"
    );


    countdown.textContent =
        remainingSeconds;


    countdownTimer =
        setInterval(
            function() {

                if (
                    !isExpired
                ) {

                    remainingSeconds--;


                    countdown.textContent =
                        remainingSeconds;


                    updateBorderProgress();


                    if (
                        remainingSeconds <= 0
                    ) {

                        isExpired =
                            true;


                        expiredSeconds =
                            0;


                        makeEyesRed();


                        wrapper.style.setProperty(
                            "--progress",
                            100
                        );


                        wrapper.classList.add(
                            "expired-border"
                        );


                        countdown.textContent =
                            "Expired +0s";


                        countdown.classList.remove(
                            "text-[#007bff]"
                        );


                        countdown.classList.add(
                            "text-red-600"
                        );


                        document.getElementById(
                            "sessionArea"
                        ).style.display =
                            "block";


                        document.getElementById(
                            "sessionSuccess"
                        ).style.display =
                            "block";


                        document.getElementById(
                            "sessionClearBtn"
                        ).style.display =
                            "block";


                        startTypingAnimation();


                        openSessionHome();

                    }

                }

                else {

                    expiredSeconds++;


                    countdown.textContent =
                        "Expired +" +
                        expiredSeconds +
                        "s";


                    makeEyesRed();


                    wrapper.style.setProperty(
                        "--progress",
                        100
                    );

                }

            },
            1000
        );

}


/* =================================================
   STOP COUNTDOWN
================================================= */

function stopCountdown() {

    if (
        countdownTimer !== null
    ) {

        clearInterval(
            countdownTimer
        );


        countdownTimer =
            null;

    }

}


/* =================================================
   START TYPING
================================================= */

function startTypingAnimation() {

    const creator =
        document.getElementById(
            "creator"
        );


    if (
        typingTimer !== null
    ) {

        return;

    }


    creator.style.display =
        "block";


    typingIndex =
        0;


    typingDirection =
        "typing";


    typingPauseCounter =
        0;


    creator.textContent =
        "";


    typingTimer =
        setInterval(
            function() {

                if (
                    typingDirection ===
                    "typing"
                ) {

                    typingIndex++;


                    creator.textContent =
                        creatorText.substring(
                            0,
                            typingIndex
                        );


                    if (
                        typingIndex >=
                        creatorText.length
                    ) {

                        typingDirection =
                            "full-pause";


                        typingPauseCounter =
                            0;

                    }

                }


                else if (
                    typingDirection ===
                    "full-pause"
                ) {

                    typingPauseCounter++;


                    if (
                        typingPauseCounter >=
                        fullTextPause
                    ) {

                        typingDirection =
                            "deleting";


                        typingPauseCounter =
                            0;

                    }

                }


                else if (
                    typingDirection ===
                    "deleting"
                ) {

                    typingIndex--;


                    creator.textContent =
                        creatorText.substring(
                            0,
                            typingIndex
                        );


                    if (
                        typingIndex <= 0
                    ) {

                        typingDirection =
                            "empty-pause";


                        typingPauseCounter =
                            0;

                    }

                }


                else if (
                    typingDirection ===
                    "empty-pause"
                ) {

                    typingPauseCounter++;


                    if (
                        typingPauseCounter >=
                        emptyTextPause
                    ) {

                        typingDirection =
                            "typing";


                        typingPauseCounter =
                            0;

                    }

                }

            },
            typingSpeed
        );

}


/* =================================================
   STOP TYPING
================================================= */

function stopTypingAnimation() {

    const creator =
        document.getElementById(
            "creator"
        );


    if (
        typingTimer !== null
    ) {

        clearInterval(
            typingTimer
        );


        typingTimer =
            null;

    }


    creator.textContent =
        "";


    creator.style.display =
        "none";


    typingIndex =
        0;


    typingDirection =
        "typing";


    typingPauseCounter =
        0;

}


/* =================================================
   CLEAR OGP
================================================= */

function clearOGP() {

    document.getElementById(
        "ogpInput"
    ).value =
        "";


    document.getElementById(
        "links"
    ).innerHTML =
        "";


    document.getElementById(
        "ogpClearBtn"
    ).style.display =
        "none";


    document.getElementById(
        "ogpInput"
    ).focus();

}


/* =================================================
   CLEAR SESSION
================================================= */

function clearSessionLink() {

    document.getElementById(
        "sessionInput"
    ).value =
        "";


    document.getElementById(
        "sessionArea"
    ).style.display =
        "block";


    document.getElementById(
        "sessionSuccess"
    ).style.display =
        "none";


    document.getElementById(
        "sessionClearBtn"
    ).style.display =
        "none";


    document.getElementById(
        "sessionInfoWrapper"
    ).style.display =
        "none";


    document.getElementById(
        "sessionInfoWrapper"
    ).style.setProperty(
        "--progress",
        0
    );


    document.getElementById(
        "sessionInfoWrapper"
    ).classList.remove(
        "expired-border"
    );


    resetEyes();


    stopTypingAnimation();


    stopCountdown();


    currentSession =
        "6848999126945";


    expiredLinkOpened =
        false;


    generateLinks();


    document.getElementById(
        "sessionInput"
    ).focus();

}


/* =================================================
   OGP KEYBOARD SHORTCUT
   Arrow Up = +2
   Arrow Down = -2
================================================= */

document.getElementById(
    "ogpInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "ArrowUp"
        ) {

            event.preventDefault();

            changeOGP(2);

        }


        if (
            event.key === "ArrowDown"
        ) {

            event.preventDefault();

            changeOGP(-2);

        }

    }
);


/* =================================================
   INITIAL LOAD
================================================= */

passwordInput.focus();

generateLinks();


</script>
