<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Columns</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #111;
        font-size: 13px;
    }

    /* =========================
       MODAL
    ========================= */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(255,255,255,0.25);
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 4px;
    }

    .column-modal {
        width: 100%;
        max-width: 100%;
        min-width: 650px;
        background: #fff;
        border-top: 3px solid #3d7777;
        box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    /* =========================
       HEADER
    ========================= */
    .modal-header {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 15px;
        border-bottom: 1px solid #ddd;
    }

    .modal-title {
        font-size: 16px;
        font-weight: 500;
    }

    .close-btn {
        width: 25px;
        height: 25px;
        border: 1px solid #ddd;
        background: #fafafa;
        color: #555;
        font-size: 20px;
        line-height: 20px;
        cursor: pointer;
        border-radius: 2px;
        padding: 0;
    }

    .close-btn:hover {
        background: #eee;
    }

    /* =========================
       BODY
    ========================= */
    .modal-body {
        min-height: 245px;
        display: flex;
        align-items: flex-start;
        padding: 16px 19px 20px;
        gap: 20px;
    }

    /* =========================
       LIST AREA
    ========================= */
    .list-section {
        width: 170px;
    }

    .list-section.display-section {
        width: 170px;
    }

    .list-title {
        height: 25px;
        border: 1px solid #d7d7d7;
        background: linear-gradient(#fafafa, #f4f4f4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #444;
    }

    .column-list {
        position: relative;
        height: 181px;
        border: 1px solid #1680dc;
        border-top: 0;
        overflow-y: auto;
        overflow-x: hidden;
        background: #fff;
        outline: none;
        padding: 4px 0;
    }

    .column-list::-webkit-scrollbar {
        width: 12px;
    }

    .column-list::-webkit-scrollbar-track {
        background: #f0f0f0;
    }

    .column-list::-webkit-scrollbar-thumb {
        background: #858585;
        border-radius: 8px;
        border: 2px solid #f0f0f0;
    }

    .column-item {
        height: 17px;
        line-height: 17px;
        padding: 0 5px;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        color: #173c70;
    }

    .column-item:hover {
        background: #e9f3ff;
    }

    .column-item.selected {
        background: #1680dc;
        color: #fff;
    }

    /* =========================
       CENTER MOVE BUTTONS
    ========================= */
    .move-buttons {
        width: 38px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding-top: 35px;
    }

    .move-btn {
        width: 30px;
        height: 28px;
        border: 0;
        background: transparent;
        color: #555;
        font-size: 24px;
        font-weight: 300;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
    }

    .move-btn:hover {
        color: #000;
    }

    .move-btn:disabled {
        color: #c9c9c9;
        cursor: default;
    }

    /* =========================
       POSITION BUTTONS
    ========================= */
    .position-buttons {
        width: 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        padding-top: 37px;
    }

    .position-btn {
        width: 26px;
        height: 25px;
        border: 0;
        background: transparent;
        cursor: pointer;
        color: #555;
        position: relative;
    }

    .position-btn:hover {
        color: #000;
    }

    .position-btn:disabled {
        color: #ccc;
        cursor: default;
    }

    /* Top arrow */
    .arrow-top::before {
        content: "";
        position: absolute;
        left: 5px;
        top: 11px;
        width: 15px;
        height: 1px;
        background: currentColor;
    }

    .arrow-top::after {
        content: "";
        position: absolute;
        left: 9px;
        top: 4px;
        width: 8px;
        height: 8px;
        border-left: 1px solid currentColor;
        border-top: 1px solid currentColor;
        transform: rotate(45deg);
    }

    /* Up arrow */
    .arrow-up::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 13px;
        width: 13px;
        height: 1px;
        background: currentColor;
    }

    .arrow-up::after {
        content: "";
        position: absolute;
        left: 10px;
        top: 7px;
        width: 7px;
        height: 7px;
        border-left: 1px solid currentColor;
        border-top: 1px solid currentColor;
        transform: rotate(45deg);
    }

    /* Down arrow */
    .arrow-down::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 10px;
        width: 13px;
        height: 1px;
        background: currentColor;
    }

    .arrow-down::after {
        content: "";
        position: absolute;
        left: 10px;
        top: 7px;
        width: 7px;
        height: 7px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        transform: rotate(45deg);
    }

    /* Bottom arrow */
    .arrow-bottom::before {
        content: "";
        position: absolute;
        left: 5px;
        bottom: 5px;
        width: 15px;
        height: 1px;
        background: currentColor;
    }

    .arrow-bottom::after {
        content: "";
        position: absolute;
        left: 9px;
        bottom: 7px;
        width: 8px;
        height: 8px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        transform: rotate(45deg);
    }

    /* =========================
       FOOTER
    ========================= */
    .modal-footer {
        height: 50px;
        border-top: 1px solid #ddd;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 15px;
        gap: 5px;
    }

    .footer-btn {
        min-width: 59px;
        height: 32px;
        border: 1px solid #ddd;
        border-radius: 2px;
        background: #f8f8f8;
        color: #444;
        font-size: 12px;
        cursor: pointer;
    }

    .footer-btn:hover {
        background: #eee;
    }

    .apply-btn {
        min-width: 58px;
        background: #086dc1;
        border-color: #086dc1;
        color: white;
        font-weight: 600;
    }

    .apply-btn:hover {
        background: #075da5;
    }

    /* =========================
       DEMO REPORT
    ========================= */
    .report-container {
        display: none;
        padding: 20px;
    }

    .report-container.show {
        display: block;
    }

    .report-title {
        font-size: 18px;
        margin-bottom: 15px;
    }

    .report-table {
        width: 100%;
        border-collapse: collapse;
    }

    .report-table th,
    .report-table td {
        border: 1px solid #ccc;
        padding: 7px;
        text-align: left;
    }

    .report-table th {
        background: #f3f3f3;
    }

    /* =========================
       RESPONSIVE
    ========================= */
    @media (max-width: 760px) {
        .column-modal {
            min-width: 0;
            width: 100%;
        }

        .modal-body {
            gap: 8px;
            padding-left: 8px;
            padding-right: 8px;
        }

        .list-section {
            flex: 1;
            min-width: 0;
        }

        .list-section.display-section {
            flex: 1;
            min-width: 0;
        }

        .move-buttons {
            width: 35px;
        }

        .position-buttons {
            width: 25px;
        }
    }
</style>
</head>

<body>

<!-- =========================================================
     SELECT COLUMNS MODAL
========================================================= -->
<div class="modal-overlay" id="modalOverlay">

    <div class="column-modal">

        <!-- HEADER -->
        <div class="modal-header">
            <div class="modal-title">Select Columns</div>

            <button
                type="button"
                class="close-btn"
                id="closeBtn"
                title="Close">
                ×
            </button>
        </div>


        <!-- BODY -->
        <div class="modal-body">

            <!-- =========================
                 DO NOT DISPLAY
            ========================== -->
            <div class="list-section">

                <div class="list-title">
                    Do Not Display
                </div>

                <div
                    class="column-list"
                    id="availableList"
                    tabindex="0">
                </div>

            </div>


            <!-- =========================
                 MOVE BUTTONS
            ========================== -->
            <div class="move-buttons">

                <!-- Move selected to right -->
                <button
                    type="button"
                    class="move-btn"
                    id="moveRight"
                    title="Display Selected">
                    ›
                </button>

                <!-- Move all to right -->
                <button
                    type="button"
                    class="move-btn"
                    id="moveAllRight"
                    title="Display All">
                    »
                </button>

                <!-- Move selected to left -->
                <button
                    type="button"
                    class="move-btn"
                    id="moveLeft"
                    title="Do Not Display Selected">
                    ‹
                </button>

                <!-- Move all to left -->
                <button
                    type="button"
                    class="move-btn"
                    id="moveAllLeft"
                    title="Do Not Display All">
                    «
                </button>

            </div>


            <!-- =========================
                 DISPLAY IN REPORT
            ========================== -->
            <div class="list-section display-section">

                <div class="list-title">
                    Display in Report
                </div>

                <div
                    class="column-list"
                    id="selectedList"
                    tabindex="0">
                </div>

            </div>


            <!-- =========================
                 CHANGE POSITION
            ========================== -->
            <div class="position-buttons">

                <button
                    type="button"
                    class="position-btn arrow-top"
                    id="moveTop"
                    title="Move to Top">
                </button>

                <button
                    type="button"
                    class="position-btn arrow-up"
                    id="moveUp"
                    title="Move Up">
                </button>

                <button
                    type="button"
                    class="position-btn arrow-down"
                    id="moveDown"
                    title="Move Down">
                </button>

                <button
                    type="button"
                    class="position-btn arrow-bottom"
                    id="moveBottom"
                    title="Move to Bottom">
                </button>

            </div>

        </div>


        <!-- FOOTER -->
        <div class="modal-footer">

            <button
                type="button"
                class="footer-btn"
                id="cancelBtn">
                Cancel
            </button>

            <button
                type="button"
                class="footer-btn apply-btn"
                id="applyBtn">
                Apply
            </button>

        </div>

    </div>
</div>


<!-- =========================================================
     DEMO REPORT
========================================================= -->
<div class="report-container" id="reportContainer">

    <div class="report-title">
        Report
    </div>

    <table class="report-table">

        <thead>
            <tr id="reportHeader"></tr>
        </thead>

        <tbody>
            <tr id="reportRow"></tr>
        </tbody>

    </table>

</div>


<script>
/* ============================================================
   COLUMN DATA
============================================================ */

const allColumns = [
    "Buyer Name",
    "Customer Name",
    "Order Number",
    "Po Number",
    "Item",
    "Uom",
    "Color",
    "Challan No",
    "Ogp Date",
    "Gate Pass No",
    "Quantity",
    "Booked Date",
    "Challandate",
    "Order Type",
    "Prefix",
    "Price",
    "Productgroup",
    "Released Status Name",
    "Resource Name",
    "Schedule Ship Date",
    "Sizes",
    "Style",
    "Fabric",
    "Composition",
    "Brand",
    "Department",
    "Season",
    "Country",
    "Remarks"
];


/* ============================================================
   DEFAULT DISPLAYED COLUMNS
============================================================ */

let defaultDisplayedColumns = [
    "Buyer Name",
    "Customer Name",
    "Order Number",
    "Po Number",
    "Item",
    "Uom",
    "Color",
    "Challan No",
    "Ogp Date",
    "Gate Pass No",
    "Quantity"
];


/* ============================================================
   CURRENT STATE
============================================================ */

let displayedColumns = [...defaultDisplayedColumns];

let availableColumns = allColumns.filter(
    column => !displayedColumns.includes(column)
);


/* ============================================================
   TEMPORARY STATE
   Cancel করলে original state ফিরে আসবে
============================================================ */

let tempDisplayedColumns = [...displayedColumns];
let tempAvailableColumns = [...availableColumns];

let activeList = null;


/* ============================================================
   DOM ELEMENTS
============================================================ */

const availableList = document.getElementById("availableList");
const selectedList = document.getElementById("selectedList");

const modalOverlay = document.getElementById("modalOverlay");

const closeBtn = document.getElementById("closeBtn");
const cancelBtn = document.getElementById("cancelBtn");
const applyBtn = document.getElementById("applyBtn");

const moveRight = document.getElementById("moveRight");
const moveAllRight = document.getElementById("moveAllRight");
const moveLeft = document.getElementById("moveLeft");
const moveAllLeft = document.getElementById("moveAllLeft");

const moveTop = document.getElementById("moveTop");
const moveUp = document.getElementById("moveUp");
const moveDown = document.getElementById("moveDown");
const moveBottom = document.getElementById("moveBottom");

const reportContainer = document.getElementById("reportContainer");
const reportHeader = document.getElementById("reportHeader");
const reportRow = document.getElementById("reportRow");


/* ============================================================
   RENDER AVAILABLE LIST
============================================================ */

function renderAvailableList() {

    availableList.innerHTML = "";

    tempAvailableColumns.forEach((column, index) => {

        const item = createColumnItem(
            column,
            "available",
            index
        );

        availableList.appendChild(item);
    });

    updateButtons();
}


/* ============================================================
   RENDER DISPLAYED LIST
============================================================ */

function renderSelectedList() {

    selectedList.innerHTML = "";

    tempDisplayedColumns.forEach((column, index) => {

        const item = createColumnItem(
            column,
            "selected",
            index
        );

        selectedList.appendChild(item);
    });

    updateButtons();
}


/* ============================================================
   CREATE COLUMN ITEM
============================================================ */

function createColumnItem(column, listType, index) {

    const item = document.createElement("div");

    item.className = "column-item";

    item.textContent = column;

    item.dataset.column = column;

    item.dataset.index = index;

    item.dataset.list = listType;

    item.addEventListener("click", function(event) {

        handleItemClick(
            event,
            item,
            listType
        );

    });

    item.addEventListener("dblclick", function() {

        if (listType === "available") {

            moveSelectedToRight();

        } else {

            moveSelectedToLeft();

        }

    });

    return item;
}


/* ============================================================
   MULTI SELECT
============================================================ */

function handleItemClick(event, item, listType) {

    const list =
        listType === "available"
            ? availableList
            : selectedList;

    const items =
        Array.from(
            list.querySelectorAll(".column-item")
        );

    /* CTRL / CMD CLICK */
    if (event.ctrlKey || event.metaKey) {

        item.classList.toggle("selected");

        activeList = listType;

        updateButtons();

        return;
    }


    /* SHIFT CLICK */
    if (event.shiftKey) {

        const selectedItems =
            items.filter(
                x => x.classList.contains("selected")
            );

        if (selectedItems.length > 0) {

            const firstIndex =
                items.indexOf(selectedItems[0]);

            const currentIndex =
                items.indexOf(item);

            const start =
                Math.min(
                    firstIndex,
                    currentIndex
                );

            const end =
                Math.max(
                    firstIndex,
                    currentIndex
                );

            items.forEach((x, i) => {

                x.classList.toggle(
                    "selected",
                    i >= start && i <= end
                );

            });

        } else {

            item.classList.add("selected");
        }

        activeList = listType;

        updateButtons();

        return;
    }


    /* NORMAL CLICK */
    items.forEach(
        x => x.classList.remove("selected")
    );

    item.classList.add("selected");

    activeList = listType;

    updateButtons();
}


/* ============================================================
   GET SELECTED COLUMNS
============================================================ */

function getSelectedItems(listElement) {

    return Array.from(
        listElement.querySelectorAll(
            ".column-item.selected"
        )
    ).map(
        item => item.dataset.column
    );
}


/* ============================================================
   MOVE SELECTED RIGHT
============================================================ */

function moveSelectedToRight() {

    const selected =
        getSelectedItems(availableList);

    if (selected.length === 0) {
        return;
    }

    selected.forEach(column => {

        const index =
            tempAvailableColumns.indexOf(column);

        if (index !== -1) {

            tempAvailableColumns.splice(
                index,
                1
            );
        }

        if (!tempDisplayedColumns.includes(column)) {

            tempDisplayedColumns.push(column);
        }
    });

    activeList = "selected";

    renderLists();

    selectColumns(
        selectedList,
        selected
    );
}


/* ============================================================
   MOVE ALL RIGHT
============================================================ */

function moveAllToRight() {

    if (tempAvailableColumns.length === 0) {
        return;
    }

    const moved =
        [...tempAvailableColumns];

    tempDisplayedColumns.push(
        ...tempAvailableColumns
    );

    tempAvailableColumns = [];

    activeList = "selected";

    renderLists();

    selectColumns(
        selectedList,
        moved
    );
}


/* ============================================================
   MOVE SELECTED LEFT
============================================================ */

function moveSelectedToLeft() {

    const selected =
        getSelectedItems(selectedList);

    if (selected.length === 0) {
        return;
    }

    selected.forEach(column => {

        const index =
            tempDisplayedColumns.indexOf(column);

        if (index !== -1) {

            tempDisplayedColumns.splice(
                index,
                1
            );
        }

        if (!tempAvailableColumns.includes(column)) {

            tempAvailableColumns.push(column);
        }
    });

    activeList = "available";

    renderLists();

    selectColumns(
        availableList,
        selected
    );
}


/* ============================================================
   MOVE ALL LEFT
============================================================ */

function moveAllToLeft() {

    if (tempDisplayedColumns.length === 0) {
        return;
    }

    const moved =
        [...tempDisplayedColumns];

    tempAvailableColumns.push(
        ...tempDisplayedColumns
    );

    tempDisplayedColumns = [];

    activeList = "available";

    renderLists();

    selectColumns(
        availableList,
        moved
    );
}


/* ============================================================
   SELECT ITEMS AFTER RENDER
============================================================ */

function selectColumns(listElement, columns) {

    const items =
        listElement.querySelectorAll(
            ".column-item"
        );

    items.forEach(item => {

        if (
            columns.includes(
                item.dataset.column
            )
        ) {

            item.classList.add(
                "selected"
            );
        }
    });

    updateButtons();
}


/* ============================================================
   MOVE UP
============================================================ */

function moveSelectedUp() {

    const selected =
        getSelectedItems(selectedList);

    if (selected.length === 0) {
        return;
    }

    /*
       Process selected items from top to bottom.
       This preserves multi-selection order.
    */

    for (
        let i = 0;
        i < tempDisplayedColumns.length;
        i++
    ) {

        const column =
            tempDisplayedColumns[i];

        if (
            selected.includes(column) &&
            i > 0
        ) {

            const previous =
                tempDisplayedColumns[i - 1];

            if (!selected.includes(previous)) {

                tempDisplayedColumns[i - 1] =
                    column;

                tempDisplayedColumns[i] =
                    previous;
            }
        }
    }

    renderLists();

    selectColumns(
        selectedList,
        selected
    );
}


/* ============================================================
   MOVE DOWN
============================================================ */

function moveSelectedDown() {

    const selected =
        getSelectedItems(selectedList);

    if (selected.length === 0) {
        return;
    }

    /*
       Process from bottom to top
       to preserve selected block.
    */

    for (
        let i =
            tempDisplayedColumns.length - 1;
        i >= 0;
        i--
    ) {

        const column =
            tempDisplayedColumns[i];

        if (
            selected.includes(column) &&
            i <
                tempDisplayedColumns.length - 1
        ) {

            const next =
                tempDisplayedColumns[i + 1];

            if (!selected.includes(next)) {

                tempDisplayedColumns[i + 1] =
                    column;

                tempDisplayedColumns[i] =
                    next;
            }
        }
    }

    renderLists();

    selectColumns(
        selectedList,
        selected
    );
}


/* ============================================================
   MOVE TO TOP
============================================================ */

function moveSelectedTop() {

    const selected =
        getSelectedItems(selectedList);

    if (selected.length === 0) {
        return;
    }

    const remaining =
        tempDisplayedColumns.filter(
            column =>
                !selected.includes(column)
        );

    tempDisplayedColumns = [
        ...selected,
        ...remaining
    ];

    renderLists();

    selectColumns(
        selectedList,
        selected
    );
}


/* ============================================================
   MOVE TO BOTTOM
============================================================ */

function moveSelectedBottom() {

    const selected =
        getSelectedItems(selectedList);

    if (selected.length === 0) {
        return;
    }

    const remaining =
        tempDisplayedColumns.filter(
            column =>
                !selected.includes(column)
        );

    tempDisplayedColumns = [
        ...remaining,
        ...selected
    ];

    renderLists();

    selectColumns(
        selectedList,
        selected
    );
}


/* ============================================================
   RENDER BOTH LISTS
============================================================ */

function renderLists() {

    renderAvailableList();

    renderSelectedList();
}


/* ============================================================
   UPDATE BUTTON STATES
============================================================ */

function updateButtons() {

    const availableSelected =
        getSelectedItems(availableList);

    const displayedSelected =
        getSelectedItems(selectedList);

    const hasAvailable =
        availableSelected.length > 0;

    const hasDisplayed =
        displayedSelected.length > 0;

    moveRight.disabled =
        !hasAvailable;

    moveLeft.disabled =
        !hasDisplayed;

    moveAllRight.disabled =
        tempAvailableColumns.length === 0;

    moveAllLeft.disabled =
        tempDisplayedColumns.length === 0;

    moveTop.disabled =
        !hasDisplayed;

    moveUp.disabled =
        !hasDisplayed;

    moveDown.disabled =
        !hasDisplayed;

    moveBottom.disabled =
        !hasDisplayed;
}


/* ============================================================
   BUTTON EVENTS
============================================================ */

moveRight.addEventListener(
    "click",
    moveSelectedToRight
);

moveAllRight.addEventListener(
    "click",
    moveAllToRight
);

moveLeft.addEventListener(
    "click",
    moveSelectedToLeft
);

moveAllLeft.addEventListener(
    "click",
    moveAllToLeft
);

moveTop.addEventListener(
    "click",
    moveSelectedTop
);

moveUp.addEventListener(
    "click",
    moveSelectedUp
);

moveDown.addEventListener(
    "click",
    moveSelectedDown
);

moveBottom.addEventListener(
    "click",
    moveSelectedBottom
);


/* ============================================================
   KEYBOARD SUPPORT
============================================================ */

availableList.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            moveSelectedToRight();
        }

    }
);


selectedList.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            moveSelectedToLeft();
        }

        if (event.key === "ArrowUp") {

            event.preventDefault();

            moveSelectedUp();
        }

        if (event.key === "ArrowDown") {

            event.preventDefault();

            moveSelectedDown();
        }

    }
);


/* ============================================================
   APPLY
============================================================ */

applyBtn.addEventListener(
    "click",
    function() {

        displayedColumns =
            [...tempDisplayedColumns];

        availableColumns =
            [...tempAvailableColumns];

        updateReport();

        closeModal();

    }
);


/* ============================================================
   CANCEL
============================================================ */

cancelBtn.addEventListener(
    "click",
    function() {

        tempDisplayedColumns =
            [...displayedColumns];

        tempAvailableColumns =
            [...availableColumns];

        closeModal();

    }
);


/* ============================================================
   CLOSE
============================================================ */

closeBtn.addEventListener(
    "click",
    function() {

        tempDisplayedColumns =
            [...displayedColumns];

        tempAvailableColumns =
            [...availableColumns];

        closeModal();

    }
);


/* ============================================================
   CLOSE MODAL FUNCTION
============================================================ */

function closeModal() {

    modalOverlay.style.display =
        "none";

    reportContainer.classList.add(
        "show"
    );
}


/* ============================================================
   OPEN MODAL
============================================================ */

function openModal() {

    tempDisplayedColumns =
        [...displayedColumns];

    tempAvailableColumns =
        [...availableColumns];

    modalOverlay.style.display =
        "flex";

    reportContainer.classList.remove(
        "show"
    );

    renderLists();
}


/* ============================================================
   REPORT UPDATE
============================================================ */

function updateReport() {

    reportHeader.innerHTML = "";

    reportRow.innerHTML = "";

    displayedColumns.forEach(
        (column, index) => {

            const th =
                document.createElement("th");

            th.textContent =
                column;

            reportHeader.appendChild(th);


            const td =
                document.createElement("td");

            td.textContent =
                "Data " + (index + 1);

            reportRow.appendChild(td);
        }
    );
}


/* ============================================================
   INITIALIZE
============================================================ */

renderLists();

updateReport();


/* ============================================================
   ESC KEY
============================================================ */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape" &&
            modalOverlay.style.display !== "none"
        ) {

            tempDisplayedColumns =
                [...displayedColumns];

            tempAvailableColumns =
                [...availableColumns];

            closeModal();
        }

    }
);


/* ============================================================
   OPTIONAL GLOBAL FUNCTIONS
   Existing application থেকে চাইলে call করা যাবে
============================================================ */

window.openColumnSelector = function() {

    openModal();

};

window.getDisplayedColumns = function() {

    return [...displayedColumns];

};

window.setDisplayedColumns = function(columns) {

    const validColumns =
        columns.filter(
            column =>
                allColumns.includes(column)
        );

    displayedColumns =
        [...validColumns];

    availableColumns =
        allColumns.filter(
            column =>
                !displayedColumns.includes(column)
        );

    updateReport();
};
</script>

</body>
</html>
